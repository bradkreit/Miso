<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miso">
<title>Chestnut Farms: Beware of Pomeranian</title>
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#bff0f7;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;font-family:"Trebuchet MS",system-ui,sans-serif}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
#pad{position:fixed;width:186px;height:186px;display:none;touch-action:none}
#pad button{position:absolute;width:62px;height:62px;border-radius:16px;border:3px solid #5b3c1e;background:#a3784a;color:#fff;font-size:24px;opacity:.88;touch-action:none}
#pad button:active{background:#7d5a33}
#up{left:62px;top:0}#down{left:62px;top:124px}#left{left:0;top:62px}#right{left:124px;top:62px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad"><button id="up">▲</button><button id="left">◀</button><button id="right">▶</button><button id="down">▼</button></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),pad=document.getElementById('pad');
const COLS=11,ROWS=15,HUD=92;
const MAPS=[
["###########",
 "#....#....#",
 "#.##.#.##.#",
 "#.........#",
 "#.H.###.H.#",
 "#...#.#...#",
 "##.#...#.##",
 "#....H....#",
 "#.##...##.#",
 "#....#....#",
 "#.H.....H.#",
 "#.#.###.#.#",
 "#.........#",
 "#..##D##..#",
 "###########"],
["###########",
 "#.........#",
 "#.#H#.#H#.#",
 "#.........#",
 "###.#.#.###",
 "#...#.#...#",
 "#.H.....H.#",
 "#...PPP...#",
 "#.#.PPP.#.#",
 "#.........#",
 "#.##.H.##.#",
 "#....#....#",
 "#.H.....H.#",
 "#....D....#",
 "###########"]];
const INFO=[
 {miso:[5,8],butter:[1,1],biscuit:[9,1],maude:[5,3],mango:[9,12],pond:null},
 {miso:[5,9],butter:[1,1],biscuit:[9,1],maude:[3,7],mango:[9,5],pond:[5,7.5]}];
const ALL=['butter','biscuit','maude','mango'];
/* Difficulty: eat = how fast Watermelon eats, catSpeed = how fast she walks,
   sulk = seconds she sulks after being shooed, sm = critter speed multiplier */
const LEVELS=[null,
 {map:0,cr:['butter','biscuit'],eat:4.4,catSpeed:2.6,sulk:3.4,sm:1.0,title:'Level 1',lines:['Catch Biscuit and Butter','before Watermelon eats',"Miso's dinner!",'Run to the bowl to shoo her.']},
 {map:0,cr:['butter','biscuit','maude'],eat:5.2,catSpeed:2.9,sulk:3.0,sm:1.04,title:'Level 2',lines:['Maude the turtle joins!','She hides in her shell.','Wait for her to peek out,','then pounce!']},
 {map:0,cr:ALL,eat:6.0,catSpeed:3.2,sulk:2.7,sm:1.08,title:'Level 3',lines:['Mango the bearded dragon','joins! He freezes, then','dashes. Time it right!']},
 {map:1,cr:ALL,eat:6.8,catSpeed:3.5,sulk:2.4,sm:1.12,title:'Level 4',lines:['The whole gang','on the big farm!']},
 {map:1,cr:ALL,eat:7.6,catSpeed:3.8,sulk:2.1,sm:1.16,finale:true,title:'Level 5: Dusk',lines:['Watermelon is starving.','Mango blends into the grass.','The chickens team up.']}];
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const OPP={up:'down',down:'up',left:'right',right:'left'};

let W,H,T,OX,OY;
let state='title',stateTime=0,time=0,level=1,round=1,endless=false,score=0,levelStartScore=0,bonus=0;
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let best=+(load('misoBest')||0),unlocked=load('misoEndless')==='1';
let map,info,dish,miso,critters=[],cat,food=100,bacon=null,baconTimer=0,zoom=0,caught=0,queued=null,mp={x:0,y:0};
let parts=[],texts=[],buttons=[];
const titleImg=new Image();let titleReady=false;
titleImg.onload=()=>{titleReady=true;};
titleImg.src='title.png';

/* ---------- layout ---------- */
function layout(){
 const dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 const land=W>H*1.1,padW=land?220:0,padH=land?0:205;
 const aw=W-padW-16,ah=H-HUD-padH-14;
 T=Math.max(12,Math.floor(Math.min(aw/COLS,ah/ROWS)));
 OX=Math.floor((W-padW-COLS*T)/2);OY=Math.floor(HUD+8+(ah-ROWS*T)/2);
 if(land){pad.style.left='auto';pad.style.right='24px';pad.style.transform='none';pad.style.bottom='40px';}
 else{pad.style.left='50%';pad.style.right='auto';pad.style.transform='translateX(-50%)';pad.style.bottom='calc(10px + env(safe-area-inset-bottom))';}
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
const px=x=>OX+(x+0.5)*T, py=y=>OY+(y+0.5)*T;

/* ---------- audio ---------- */
let ac=null;
function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();}
function tone(f1,f2,dur,type,vol,delay){if(!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.03);}
const SND={
 yip(){tone(800,1400,.08,'square',.05);tone(900,1500,.08,'square',.045,.11)},
 chomp(){tone(240,90,.12,'sawtooth',.07);tone(320,120,.1,'square',.05,.08)},
 hiss(){tone(1800,500,.28,'sawtooth',.03)},
 cluck(){tone(520,360,.06,'triangle',.06);tone(620,420,.06,'triangle',.05,.09)},
 bonk(){tone(220,140,.09,'sine',.09)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.15,'triangle',.07,i*.12))},
 lose(){[392,330,262].forEach((f,i)=>tone(f,f*.97,.22,'triangle',.07,i*.2))}};

/* ---------- maze helpers ---------- */
function open(x,y){if(y<0||y>=ROWS||x<0||x>=COLS)return false;const ch=map[y][x];return ch==='.'||ch==='D';}
function nearHay(x,y){for(const d of Object.values(DIRS)){const r=map[y+d.y];if(r&&r[x+d.x]==='H')return true;}return false;}
function mover(x,y){return{cx:x,cy:y,nx:x,ny:y,t:0,dir:null,flip:false};}
function P(e){return{x:e.cx+(e.nx-e.cx)*e.t,y:e.cy+(e.ny-e.cy)*e.t};}
function moving(e){return e.nx!==e.cx||e.ny!==e.cy;}
function face(e){if(e.dir==='left')e.flip=true;else if(e.dir==='right')e.flip=false;}
function step(e,dt,spd){
 let mv=spd*dt,guard=0;
 while(mv>1e-6&&guard++<10){
  if(!moving(e)){const d=e.choose(e);if(!d)return;e.dir=d;e.nx=e.cx+DIRS[d].x;e.ny=e.cy+DIRS[d].y;e.t=0;}
  const r=1-e.t;
  if(mv>=r){mv-=r;e.cx=e.nx;e.cy=e.ny;e.t=0;if(e.onArrive)e.onArrive(e);}
  else{e.t+=mv;mv=0;}
 }
}

/* ---------- level setup ---------- */
function cfg(){
 if(!endless)return LEVELS[level];
 return{map:(round-1)%2,cr:ALL,eat:Math.min(11,6.4+0.5*round),catSpeed:Math.min(4.8,3.2+0.15*round),sulk:Math.max(1.6,2.6-0.1*round),sm:1.1+Math.min(0.2,0.02*round),title:'Round '+round,lines:["Keep Miso's dinner safe",'as long as you can!']};
}
function setupLevel(){
 const c=cfg();map=MAPS[c.map];info=INFO[c.map];
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(map[y][x]==='D')dish={x,y};
 miso=mover(info.miso[0],info.miso[1]);miso.dir='left';miso.flip=true;miso.mouth=0;miso.choose=chooseMiso;
 critters=c.cr.map(makeCritter);
 cat={state:'perch',f:0,timer:2,flip:true,sulk:false};
 food=100;bacon=null;baconTimer=12+Math.random()*6;zoom=0;caught=0;queued=null;parts=[];texts=[];
 levelStartScore=score;mp=P(miso);
}
function makeCritter(n){
 const s=info[n],e=mover(s[0],s[1]);
 Object.assign(e,{name:n,alive:true,speed:{butter:3.6,biscuit:3.4,maude:1.5,mango:2.2}[n],state:n==='mango'?'bask':'walk',
  timer:0,cool:0,help:0,helpCool:2,bonk:0,dashLeft:0,still:n==='mango',pts:{butter:100,biscuit:100,maude:200,mango:300}[n],
  choose:chooseCritter,onArrive:arriveCritter});
 return e;
}

/* ---------- AI ---------- */
function chooseMiso(e){
 if(queued&&open(e.cx+DIRS[queued].x,e.cy+DIRS[queued].y))return queued;
 if(e.dir&&open(e.cx+DIRS[e.dir].x,e.cy+DIRS[e.dir].y))return e.dir;
 return null;
}
function chooseCritter(e){
 if(e.name==='maude'&&e.state!=='walk')return null;
 if(e.name==='mango'&&(e.state==='bask'||e.state==='freeze'||e.state==='rest'))return null;
 let opts=Object.keys(DIRS).filter(d=>open(e.cx+DIRS[d].x,e.cy+DIRS[d].y));
 if(!opts.length)return null;
 if(opts.length>1&&e.dir)opts=opts.filter(d=>d!==OPP[e.dir]);
 const md=Math.hypot(mp.x-e.cx,mp.y-e.cy);
 let bestD=null,bs=-1e9;
 for(const d of opts){
  const tx=e.cx+DIRS[d].x,ty=e.cy+DIRS[d].y,dd=Math.hypot(mp.x-tx,mp.y-ty);
  let s=Math.random()*0.4;
  if(e.help>0)s-=dd*1.2;
  else if(e.name==='maude'){s+=Math.random()*1.5;if(info.pond)s-=Math.hypot(info.pond[0]-tx,info.pond[1]-ty)*0.35;}
  else if(e.name==='mango'){s+=e.state==='dash'?dd*1.3:Math.random()*2;}
  else{const scared=md<(e.name==='butter'?8:6.5);s+=scared?dd:Math.random()*2;if(e.name==='biscuit'&&nearHay(tx,ty))s+=scared?1.2:0.5;}
  if(s>bs){bs=s;bestD=d;}
 }
 return bestD;
}
function arriveCritter(e){if(e.name==='mango'&&e.state==='dash'&&--e.dashLeft<=0){e.state='rest';e.timer=1.1;}}
function perch(){return{x:(W-58-OX)/T-0.5,y:(HUD-38-OY)/T-0.5};}
function catTarget(){return{x:dish.x+0.8,y:dish.y-0.15};}
function catPos(){const a=perch(),b=catTarget();return{x:a.x+(b.x-a.x)*cat.f,y:a.y+(b.y-a.y)*cat.f};}

/* ---------- update ---------- */
function update(dt){
 const c=cfg();
 zoom-=dt;miso.mouth=Math.max(0,miso.mouth-dt*2.5);
 if(queued&&miso.dir&&queued===OPP[miso.dir]&&moving(miso)){
  [miso.cx,miso.nx]=[miso.nx,miso.cx];[miso.cy,miso.ny]=[miso.ny,miso.cy];miso.t=1-miso.t;miso.dir=queued;
 }
 step(miso,dt,4*(1-0.04*caught)*(zoom>0?1.6:1));face(miso);mp=P(miso);

 for(const e of critters){
  if(!e.alive)continue;
  const p=P(e),d=Math.hypot(p.x-mp.x,p.y-mp.y);
  e.timer-=dt;e.cool-=dt;e.help-=dt;e.helpCool-=dt;e.bonk-=dt;
  let still=false,spd=e.speed*c.sm;
  if(e.name==='maude'){
   if(e.state==='walk'&&d<2.2&&e.cool<=0){e.state='shell';e.timer=2.6;}
   else if(e.state==='shell'&&e.timer<=0){e.state='peek';e.timer=0.6;}
   else if(e.state==='peek'&&e.timer<=0){e.state='walk';e.cool=1.8;}
   still=e.state!=='walk';
  }else if(e.name==='mango'){
   if((e.state==='bask'||e.state==='creep')&&d<3.6){e.state='freeze';e.timer=0.45;}
   else if(e.state==='freeze'&&e.timer<=0){e.state='dash';e.dashLeft=6;}
   else if(e.state==='rest'&&e.timer<=0){e.state='creep';}
   still=e.state==='bask'||e.state==='freeze'||e.state==='rest';
   if(e.state==='dash')spd=7.5*c.sm;
  }else{
   const other=critters.find(o=>o!==e&&o.alive&&(o.name==='butter'||o.name==='biscuit'));
   if(other&&e.help<=0&&e.helpCool<=0){
    const op=P(other),od=Math.hypot(op.x-mp.x,op.y-mp.y);
    if(od<(c.finale?2.8:2.3)&&d>3.5){e.help=c.finale?2.2:1.6;e.helpCool=c.finale?4:6;addText('Bawk!',p.x,p.y-0.6,'#7a4a12');SND.cluck();}
   }
   if(e.help>0&&d<2.2)e.help=0;
  }
  e.still=still;
  if(!still){step(e,dt,spd);face(e);}
 }

 for(const e of critters){
  if(!e.alive)continue;
  const p=P(e);
  if(Math.hypot(p.x-mp.x,p.y-mp.y)<0.7){
   if(e.name==='maude'&&e.state==='shell'){if(e.bonk<=0){addText('Bonk!',p.x,p.y-0.5,'#4a7330');SND.bonk();e.bonk=1;}}
   else{catchIt(e);if(state!=='play')return;}
  }
 }

 if(bacon){
  bacon.life-=dt;
  if(bacon.life<=0){bacon=null;baconTimer=14+Math.random()*6;}
  else if(Math.hypot(bacon.x-mp.x,bacon.y-mp.y)<0.7){bacon=null;zoom=4;baconTimer=16+Math.random()*6;addText('ZOOMIES!',mp.x,mp.y-0.6,'#d2452e');SND.yip();}
 }else if((baconTimer-=dt)<=0){
  const spots=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(open(x,y)&&Math.hypot(x-mp.x,y-mp.y)>5&&!(x===dish.x&&y===dish.y))spots.push({x,y});
  const s=spots[Math.floor(Math.random()*spots.length)];
  if(s)bacon={x:s.x,y:s.y,life:6};else baconTimer=3;
 }

 const pp=perch(),tg=catTarget(),len=Math.max(1,Math.hypot(tg.x-pp.x,tg.y-pp.y));
 if(cat.state==='perch'){if((cat.timer-=dt)<=0){cat.state='walk';cat.sulk=false;}}
 else if(cat.state==='walk'){cat.f=Math.min(1,cat.f+c.catSpeed*dt/len);if(cat.f>=1)cat.state='eat';}
 else if(cat.state==='eat'){food-=c.eat*dt;if(food<=0){food=0;lose();return;}}
 else if(cat.state==='flee'){cat.f-=7*dt/len;if(cat.f<=0){cat.f=0;cat.state='perch';cat.timer=c.sulk;}}
 cat.flip=cat.state!=='flee';
 if(Math.hypot(mp.x-dish.x,mp.y-dish.y)<1.6&&(cat.state==='eat'||(cat.state==='walk'&&cat.f>0.55))){
  cat.state='flee';cat.sulk=true;SND.hiss();SND.yip();miso.mouth=1;
  const q=catPos();addText('Hiss!',q.x,q.y-0.6,'#555');
 }
}
function catchIt(e){
 e.alive=false;caught++;score+=e.pts;const p=P(e);
 puff(p.x,p.y,{butter:'#e8963a',biscuit:'#ffffff',maude:'#7bb04f',mango:'#dda757'}[e.name]);
 addText(['CHOMP!','NOM!','GOTCHA!'][Math.floor(Math.random()*3)],p.x,p.y-0.5,'#d2452e');
 SND.chomp();miso.mouth=1;
 if(critters.every(o=>!o.alive))win();
}
function win(){
 bonus=Math.round(food)*5;score+=bonus;SND.win();
 if(endless){saveBest();setState('clear');}
 else if(level===5){unlocked=true;store('misoEndless','1');setState('victory');}
 else setState('clear');
}
function lose(){SND.lose();if(endless){saveBest();setState('gameover');}else setState('lose');}
function saveBest(){if(score>best){best=score;store('misoBest',best);}}
function setState(s){state=s;stateTime=0;}
function startGame(isEndless){endless=isEndless;level=1;round=1;score=0;setupLevel();setState('intro');SND.yip();}

/* ---------- effects ---------- */
function puff(x,y,col){for(let i=0;i<16;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3-.5,life:.9+Math.random()*.5,col,rot:Math.random()*6,vr:(Math.random()-.5)*8});}
function addText(s,x,y,col){texts.push({s,x,y,col,life:1.1});}
function updateFx(dt){
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=3*dt;p.vx*=.98;p.rot+=p.vr*dt;p.life-=dt;}
 for(const t of texts){t.y-=.9*dt;t.life-=dt;}
 parts=parts.filter(p=>p.life>0);texts=texts.filter(t=>t.life>0);
}

/* ---------- drawing helpers ---------- */
function E(x,y,rx,ry,c,rot,o){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(o){ctx.strokeStyle='#3b2a1c';ctx.lineWidth=Math.max(1,(Math.abs(rx)+Math.abs(ry))*.045);ctx.stroke();}}
function C(x,y,r,c,o){E(x,y,r,r,c,0,o);}
function tri(a,b,d,col){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function rr(x,y,w,h,r,c,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(c){ctx.fillStyle=c;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function txt(s,x,y,size,col,align,weight,stroke){ctx.font=(weight||'bold')+' '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=size*.2;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function serif(s,x,y,size,col,align){ctx.font='700 '+size+'px Georgia,"Times New Roman",serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}

/* ---------- characters ---------- */
function drawMiso(x,y,s,flip,round,bob,mouth){
 const k=s*.42*(1+round);
 ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);
 E(0,k*.85,k,k*.22,'rgba(30,100,20,.3)');
 E(-k*.45,k*.62,k*.15,k*.2,'#c98a52');E(k*.3,k*.62,k*.15,k*.2,'#c98a52');
 E(-k*.78,-k*.3+bob,k*.42,k*.38,'#f4d9b0',0,1);
 E(-k*.08,k*.18+bob,k*.78,k*.55,'#e2a065',0,1);
 E(k*.32,k*.08+bob,k*.45,k*.5,'#ecb47c');
 tri([k*.22,-k*.5+bob],[k*.32,-k*.92+bob],[k*.52,-k*.55+bob],'#c98448');
 tri([k*.58,-k*.58+bob],[k*.78,-k*.92+bob],[k*.86,-k*.48+bob],'#c98448');
 C(k*.55,-k*.2+bob,k*.46,'#eab077',1);
 C(k*.6,-k*.34+bob,k*.075,'#24160c');C(k*.62,-k*.37+bob,k*.025,'#fff');
 C(k*.98,-k*.2+bob,k*.08,'#24160c');
 const my=k*.02+bob,mh=k*(.1+.22*mouth);
 E(k*.76,my,k*.2,mh,'#6b1f1f',0,1);
 for(let i=0;i<4;i++){const tx=k*(.6+i*.08);
  tri([tx,my-mh*.85],[tx+k*.04,my-mh*.85+k*.09],[tx+k*.08,my-mh*.85],'#fff');
  if(mouth>.2)tri([tx,my+mh*.85],[tx+k*.04,my+mh*.85-k*.08],[tx+k*.08,my+mh*.85],'#fff');}
 ctx.restore();
}
function drawMisoSleep(x,y,s){
 const k=s*.45;
 E(x,y+k*.6,k*1.4,k*.25,'rgba(20,60,20,.4)');
 E(x,y+k*.05,k*1.2,k*.72,'#e2a065',0,1);
 E(x-k*.95,y-k*.25,k*.48,k*.42,'#f4d9b0',0,1);
 tri([x+k*.42,y-k*.25],[x+k*.52,y-k*.68],[x+k*.72,y-k*.3],'#c98448');
 C(x+k*.7,y+k*.05,k*.45,'#eab077',1);
 ctx.strokeStyle='#2a1a10';ctx.lineWidth=Math.max(1.5,k*.06);ctx.beginPath();ctx.arc(x+k*.78,y-k*.02,k*.1,.1*Math.PI,.9*Math.PI);ctx.stroke();
 C(x+k*1.12,y+k*.12,k*.07,'#2a1a10');

function setDir(d){queued=d;if(state==='intro'&&stateTime>.3)setState('play');}
function tap(x,y){
 if(stateTime<.4)return;
 if(state==='title'){for(const b of buttons)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.act();return;}}
 else if(state==='intro')setState('play');
 else if(state==='clear'){if(endless)round++;else level++;setupLevel();setState('intro');}
 else if(state==='lose'){score=levelStartScore;setupLevel();setState('intro');}
 else if(state==='victory'||state==='gameover')setState('title');
}

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<400)e.preventDefault();lastTouchEnd=n;},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;stateTime+=dt;
 if(state==='play')update(dt);
 updateFx(dt);draw();requestAnimationFrame(loop);
}
layout();requestAnimationFrame(loop);
</script>
</body>
</html>
